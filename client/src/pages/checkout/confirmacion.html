<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd — Pedido confirmado</title>
    <link rel="icon" href="/public/assets/images/logo.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/components/header.css">
    <link rel="stylesheet" href="../../styles/components/footer.css">
    <link rel="stylesheet" href="../../styles/components/toast.css">
    <link rel="stylesheet" href="../../styles/pages/checkout.css">
    <link rel="stylesheet" href="../../styles/pages/confirmacion.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-left">
            <a class="co-back" href="/src/pages/tienda/tienda.html" aria-label="Seguir comprando">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12,19 5,12 12,5"/>
                </svg>
            </a>
        </nav>

        <div class="logo-center">
            <a href="/src/pages/index.html">
                <img src="/public/assets/images/logo.png" alt="Unlockd">
            </a>
        </div>

        <div class="nav-right">
            <nav class="co-pasos" aria-label="Pasos del checkout">
                <span class="co-paso co-paso--hecho">Carrito</span>
                <span class="co-paso-sep">/</span>
                <span class="co-paso co-paso--hecho">Envío</span>
                <span class="co-paso-sep">/</span>
                <span class="co-paso co-paso--hecho">Pago</span>
            </nav>
        </div>
    </header>

    <main class="conf-main">

        <div class="conf-icono">
            <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="26" cy="26" r="25" stroke="#000" stroke-width="1.5"/>
                <polyline points="16,27 23,34 36,19" stroke="#000" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <p class="conf-label">Pedido confirmado</p>
        <h1 class="conf-titulo" id="confRef">—</h1>
        <p class="conf-subtexto" id="confEmail">Recibirás una confirmación en tu correo electrónico.</p>

        <!-- Resumen del pedido -->
        <div class="conf-resumen" id="confResumen">
            <!-- Items cargados por confirmacion.js -->
        </div>

        <div class="conf-totales" id="confTotales"></div>

        <div class="conf-acciones">
            <a href="/src/pages/tienda/tienda.html" class="conf-btn-tienda">Seguir comprando</a>
            <a href="/src/pages/cuenta/cuenta.html" class="conf-btn-cuenta">Ver mis pedidos</a>
        </div>

    </main>

    <script type="module" src="../../scripts/main.js"></script>
    <script type="module" src="../../scripts/pages/confirmacion.js"></script>

</body>
</html>
