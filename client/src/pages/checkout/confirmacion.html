<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd — Pedido confirmado</title>
    <link rel="icon" href="/public/assets/images/logo.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/components/header.css">
    <link rel="stylesheet" href="../../styles/components/footer.css">
    <link rel="stylesheet" href="../../styles/components/toast.css">
    <link rel="stylesheet" href="../../styles/pages/checkout.css">
    <link rel="stylesheet" href="../../styles/pages/confirmacion.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-left">
            <a href="/src/pages/index.html">Inicio</a>
            <a href="/src/pages/tienda/tienda.html">Tienda</a>
            <a href="/src/pages/contacto/contacto.html">Contacto</a>
        </nav>

        <div class="nav-mobile-left">
            <button class="nav-hamburguesa" id="btnHamburguesa" aria-label="Menú" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <span class="icon" id="btnBuscadorMobile">
                <img src="/public/assets/images/icons/logo-lupa.svg" alt="Buscar">
            </span>
        </div>

        <div class="logo-center">
            <a href="/src/pages/index.html">
                <img src="/public/assets/images/logo.png" alt="Logo Principal">
            </a>
        </div>

        <div class="nav-right">
            <span class="icon">
                <img src="/public/assets/images/icons/logo-lupa.svg" alt="Buscar">
            </span>
            <span class="icon">
                <a href="/src/pages/auth/login.html">
                    <img src="/public/assets/images/icons/logo-perfil.svg" alt="Perfil">
                </a>
            </span>
            <span class="icon">
                <img src="/public/assets/images/icons/logo-cesta.svg" alt="Carrito">
            </span>
        </div>
    </header>

    <main class="conf-main">

        <div class="conf-icono">
            <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="26" cy="26" r="25" stroke="#000" stroke-width="1.5"/>
                <polyline points="16,27 23,34 36,19" stroke="#000" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <p class="conf-label">Pedido confirmado</p>
        <h1 class="conf-titulo" id="confRef">—</h1>
        <p class="conf-subtexto" id="confEmail">Recibirás una confirmación en tu correo electrónico.</p>

        <!-- Resumen del pedido -->
        <div class="conf-resumen" id="confResumen">
            <!-- Items cargados por confirmacion.js -->
        </div>

        <div class="conf-totales" id="confTotales"></div>

        <div class="conf-acciones">
            <a href="/src/pages/tienda/tienda.html" class="conf-btn-tienda">Seguir comprando</a>
            <a href="/src/pages/cuenta/cuenta.html" class="conf-btn-cuenta">Ver mis pedidos</a>
        </div>

    </main>

    <script type="module" src="../../scripts/main.js"></script>
    <script type="module" src="../../scripts/pages/confirmacion.js"></script>

</body>
</html>
