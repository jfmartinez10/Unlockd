<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd — Checkout</title>
    <link rel="icon" href="/public/assets/images/logo.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/components/toast.css">
    <link rel="stylesheet" href="../../styles/pages/checkout.css">
</head>
<body class="checkout-body">

<div class="co-layout">

    <!-- ── Panel izquierdo (formulario) ───────────────────── -->
    <div class="co-left">

        <!-- Logo -->
        <div class="co-logo">
            <a href="/src/pages/index.html">
                <img src="/public/assets/images/logo.png" alt="Unlockd" width="52" height="52">
            </a>
        </div>

        <!-- ═══════════════════════════════════════════════
             BLOQUE 1 — CONTACTO
        ═══════════════════════════════════════════════ -->
        <div class="co-bloque">
            <div class="co-bloque-header">
                <h2 class="co-bloque-titulo">Contacto</h2>
                <a href="/src/pages/auth/login.html" class="co-link-accion" id="coLinkLogin">Iniciar sesión</a>
            </div>

            <div class="co-campo">
                <input type="email" class="co-input" id="coEmail" name="email"
                       placeholder="Correo electrónico" required autocomplete="email">
            </div>

            <label class="co-checkbox">
                <input type="checkbox" id="coNewsletter">
                <span>Enviarme novedades y ofertas por correo electrónico</span>
            </label>
        </div>

        <!-- ═══════════════════════════════════════════════
             BLOQUE 2 — DIRECCIÓN DE ENVÍO
        ═══════════════════════════════════════════════ -->
        <div class="co-bloque">
            <h2 class="co-bloque-titulo">Dirección de envío</h2>

            <!-- País -->
            <div class="co-campo">
                <label class="co-label" for="coPais">País / Región</label>
                <select class="co-input co-select" id="coPais" name="pais" required>
                    <option value="">Selecciona un país</option>
                    <option value="España" selected>España</option>
                    <option value="Andorra">Andorra</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Bolivia">Bolivia</option>
                    <option value="Chile">Chile</option>
                    <option value="Colombia">Colombia</option>
                    <option value="Costa Rica">Costa Rica</option>
                    <option value="Cuba">Cuba</option>
                    <option value="Ecuador">Ecuador</option>
                    <option value="El Salvador">El Salvador</option>
                    <option value="Estados Unidos">Estados Unidos</option>
                    <option value="Francia">Francia</option>
                    <option value="Guatemala">Guatemala</option>
                    <option value="Honduras">Honduras</option>
                    <option value="Italia">Italia</option>
                    <option value="México">México</option>
                    <option value="Nicaragua">Nicaragua</option>
                    <option value="Panamá">Panamá</option>
                    <option value="Paraguay">Paraguay</option>
                    <option value="Perú">Perú</option>
                    <option value="Portugal">Portugal</option>
                    <option value="Puerto Rico">Puerto Rico</option>
                    <option value="República Dominicana">República Dominicana</option>
                    <option value="Uruguay">Uruguay</option>
                    <option value="Venezuela">Venezuela</option>
                </select>
            </div>

            <!-- Nombre y Apellidos -->
            <div class="co-fila">
                <div class="co-campo">
                    <input type="text" class="co-input" id="coNombre" name="nombre"
                           placeholder="Nombre" required autocomplete="given-name">
                </div>
                <div class="co-campo">
                    <input type="text" class="co-input" id="coApellidos" name="apellidos"
                           placeholder="Apellidos" required autocomplete="family-name">
                </div>
            </div>

            <!-- Dirección con autocompletado -->
            <div class="co-campo co-campo--autocomplete">
                <input type="text" class="co-input" id="coDireccion" name="direccion"
                       placeholder="Dirección" required autocomplete="off">
                <div class="co-autocomplete-lista" id="autocompleteLista"></div>
            </div>

            <div class="co-campo">
                <input type="text" class="co-input" id="coDireccion2" name="direccion2"
                       placeholder="Apartamento, suite, etc. (opcional)">
            </div>

            <!-- Ciudad y CP -->
            <div class="co-fila">
                <div class="co-campo">
                    <input type="text" class="co-input" id="coCiudad" name="ciudad"
                           placeholder="Ciudad" required autocomplete="address-level2">
                </div>
                <div class="co-campo">
                    <input type="text" class="co-input" id="coCP" name="cp"
                           placeholder="Código postal" required autocomplete="postal-code"
                           inputmode="numeric" maxlength="10">
                </div>
            </div>

            <!-- Teléfono -->
            <div class="co-campo">
                <input type="tel" class="co-input" id="coTelefono" name="telefono"
                       placeholder="Teléfono (opcional)"
                       inputmode="numeric" maxlength="15">
            </div>

            <label class="co-checkbox co-checkbox--mt">
                <input type="checkbox" id="coGuardarInfo">
                <span>Guardar mi información para la próxima vez</span>
            </label>
        </div>

        <!-- ═══════════════════════════════════════════════
             BLOQUE 3 — MÉTODO DE ENVÍO
        ═══════════════════════════════════════════════ -->
        <div class="co-bloque">
            <h2 class="co-bloque-titulo">Envío</h2>
            <div class="co-metodos-envio" id="metodosEnvio">
                <!-- Generado por JS tras cargar el carrito -->
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════
             BLOQUE 4 — PAGO
        ═══════════════════════════════════════════════ -->
        <div class="co-bloque">
            <h2 class="co-bloque-titulo">Pago</h2>
            <p class="co-pago-nota">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
                    <path d="M8 1l1.5 3 3.5.5-2.5 2.5.5 3.5L8 9l-3 1.5.5-3.5L3 4.5 6.5 4z"/>
                </svg>
                Todas las transacciones son seguras y están cifradas.
            </p>

            <!-- Número de tarjeta -->
            <div class="co-campo co-campo--icono">
                <input type="text" class="co-input" id="pagoTarjeta"
                       placeholder="Número de tarjeta"
                       maxlength="19" inputmode="numeric" autocomplete="cc-number">
                <span class="co-input-icono">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
                        <rect x="1" y="4" width="22" height="16" rx="2"/>
                        <line x1="1" y1="10" x2="23" y2="10"/>
                    </svg>
                </span>
            </div>

            <!-- Nombre en tarjeta -->
            <div class="co-campo">
                <input type="text" class="co-input" id="pagoNombre"
                       placeholder="Nombre en la tarjeta"
                       autocomplete="cc-name">
            </div>

            <!-- Expiración + CVV -->
            <div class="co-fila">
                <div class="co-campo">
                    <input type="text" class="co-input" id="pagoExp"
                           placeholder="MM/AA"
                           autocomplete="cc-exp"
                           maxlength="5" inputmode="numeric">
                </div>
                <div class="co-campo co-campo--icono">
                    <input type="text" class="co-input" id="pagoCVV"
                           placeholder="Código de seguridad (CVV)"
                           maxlength="3" inputmode="numeric" autocomplete="cc-csc">
                    <span class="co-input-icono">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                            <rect x="1" y="4" width="22" height="16" rx="2"/>
                            <path d="M1 10h22"/>
                            <path d="M7 15h2M11 15h2M15 15h2" stroke-linecap="round"/>
                        </svg>
                    </span>
                </div>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════
             NOTA DEL PEDIDO
        ═══════════════════════════════════════════════ -->
        <div class="co-bloque">
            <h2 class="co-bloque-titulo">Nota del pedido</h2>
            <div class="co-campo">
                <textarea class="co-input co-nota-textarea" id="coNota"
                          placeholder="Añade cualquier indicación especial para tu pedido (opcional)"
                          rows="3" maxlength="500"></textarea>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════
             BOTÓN FINALIZAR
        ═══════════════════════════════════════════════ -->
        <button class="co-btn-finalizar" id="btnFinalizarPedido">
            Finalizar pedido
        </button>

        <a href="/src/pages/tienda/tienda.html" class="co-link-volver">Volver a la tienda</a>

        <!-- Footer legal -->
        <footer class="co-footer-legal">
            <a href="/src/pages/legal/politica-reembolso.html">Política de reembolso</a>
            <a href="/src/pages/legal/politica-privacidad.html">Política de privacidad</a>
            <a href="/src/pages/legal/terminos-servicio.html">Términos del servicio</a>
        </footer>

    </div><!-- /co-left -->

    <!-- ── Panel derecho (resumen — sticky) ───────────────── -->
    <div class="co-right">
        <div class="co-right-inner">

            <div class="co-items" id="coItems"></div>

            <!-- Código de descuento -->
            <div class="co-descuento">
                <div class="co-descuento-fila">
                    <input type="text" class="co-input co-descuento-input" id="coDescuento"
                           placeholder="Código de descuento o tarjeta de regalo">
                    <button class="co-btn-aplicar" id="btnAplicarDescuento">Aplicar</button>
                </div>
                <p class="co-descuento-msg" id="descuentoMsg"></p>
            </div>

            <!-- Nota del pedido (solo si la hay) -->
            <div class="co-nota-resumen" id="notaResumen" style="display:none">
                <p class="co-nota-label">Nota</p>
                <p class="co-nota-texto" id="notaTexto"></p>
            </div>

            <!-- Totales -->
            <div class="co-totales">
                <div class="co-total-fila">
                    <span>Subtotal</span>
                    <span id="coSubtotal">—</span>
                </div>
                <div class="co-total-fila" id="filaDescuento" style="display:none">
                    <span>Descuento</span>
                    <span id="coDescuentoValor" class="co-color-verde">—</span>
                </div>
                <div class="co-total-fila">
                    <span>Envío</span>
                    <span id="coEnvio" class="co-envio-pendiente">Calculado abajo</span>
                </div>
                <div class="co-total-fila co-total-fila--grande">
                    <span>Total</span>
                    <span id="coTotal">—</span>
                </div>
            </div>

        </div>
    </div>

</div>

<!-- Toggle resumen en móvil -->
<div class="co-movil-toggle" id="movilToggle">
    <button class="co-movil-toggle-btn" id="btnToggleResumen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
        </svg>
        <span id="toggleTexto">Mostrar resumen del pedido</span>
        <span id="toggleTotal" class="co-movil-total"></span>
    </button>
    <div class="co-movil-resumen" id="movilResumen"></div>
</div>

<script type="module" src="../../scripts/pages/checkout.js"></script>

</body>
</html>
