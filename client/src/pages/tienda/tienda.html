<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd - Tienda</title>
    <link rel="icon" href="/public/assets/images/logo.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/components/header.css">
    <link rel="stylesheet" href="../../styles/components/footer.css">
    <link rel="stylesheet" href="../../styles/pages/tienda.css">
    <link rel="stylesheet" href="../../styles/components/buttons.css">
    <link rel="stylesheet" href="../../styles/components/quick-add.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-left">
            <a href="/src/pages/index.html">Inicio</a>
            <a href="/src/pages/tienda/tienda.html">Tienda</a>
            <a href="/src/pages/contacto/contacto.html">Contacto</a>
        </nav>

        <div class="nav-mobile-left">
            <button class="nav-hamburguesa" id="btnHamburguesa" aria-label="Menú" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <span class="icon" id="btnBuscadorMobile">
                <img src="/public/assets/images/icons/logo-lupa.svg" alt="Buscar">
            </span>
        </div>

        <div class="logo-center">
            <a href="/src/pages/index.html">
                <img src="/public/assets/images/logo.png" alt="Logo Principal">
            </a>
        </div>

        <div class="nav-right">
            <span class="icon">
                <img src="/public/assets/images/icons/logo-lupa.svg" alt="Buscar">
            </span>
            <span class="icon">
                <a href="/src/pages/auth/login.html">
                    <img src="/public/assets/images/icons/logo-perfil.svg" alt="Perfil">
                </a>
            </span>
            <span class="icon">
                <img src="/public/assets/images/icons/logo-cesta.svg" alt="Carrito">
            </span>
        </div>
    </header>

    <main class="tienda-pagina">

        <div class="tienda-controles">

            <span class="tienda-contador" id="tiendaContador"></span>

            <div class="tienda-controles-derecha">

                <!-- Toggle vista -->
                <div class="tienda-vista-toggle" id="tiendaVistaToggle" aria-label="Cambiar vista">
                    <button class="tienda-vista-btn activo" id="btnVistaGrid" aria-label="Vista cuadrícula" data-vista="grid">
                        <svg viewBox="0 0 18 18" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="2" y="2" width="6" height="6"/><rect x="10" y="2" width="6" height="6"/>
                            <rect x="2" y="10" width="6" height="6"/><rect x="10" y="10" width="6" height="6"/>
                        </svg>
                    </button>
                    <button class="tienda-vista-btn" id="btnVistaLista" aria-label="Vista lista" data-vista="lista">
                        <svg viewBox="0 0 18 18" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                            <line x1="2" y1="4.5" x2="16" y2="4.5"/>
                            <line x1="2" y1="9"   x2="16" y2="9"/>
                            <line x1="2" y1="13.5" x2="16" y2="13.5"/>
                        </svg>
                    </button>
                </div>

                <button class="tienda-btn-control tienda-btn-filtros" id="btnAbrirFiltros" aria-expanded="false">
                    <svg viewBox="0 0 18 18" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                        <line x1="2" y1="4.5"  x2="16" y2="4.5"/>
                        <line x1="4" y1="9"    x2="14" y2="9"/>
                        <line x1="6" y1="13.5" x2="12" y2="13.5"/>
                    </svg>
                    Filtros
                    <span class="tienda-filtros-badge" id="filtrosBadge" style="display:none"></span>
                </button>

            </div>
        </div>

        <div class="tienda-grid" id="tiendaGrid"></div>

        <div class="tienda-paginacion" id="tiendaPaginacion">
            <div class="tienda-pagina-dots" id="paginaDots"></div>
        </div>

    </main>

    <footer class="main-footer">
        <div class="footer-left">
            <a href="/src/pages/legal/politica-privacidad.html" class="footer-link">Política de Privacidad</a>
            <a href="/src/pages/legal/politica-reembolso.html" class="footer-link">Política de Reembolso</a>
            <a href="/src/pages/legal/terminos-servicio.html" class="footer-link">Términos de Servicio</a>
        </div>
        <div class="footer-center">
            <img src="/public/assets/images/logo.png" alt="Logo Unlockd" class="footer-logo">
            <p class="footer-copyright">&copy; 2026 - Unlockd</p>
        </div>
    </footer>

    <!-- ── Panel de filtros ─────────────────────────────────── -->
    <div class="filtros-overlay" id="filtrosOverlay" aria-hidden="true"></div>
    <aside class="filtros-panel" id="filtrosPanel" aria-label="Filtros" aria-hidden="true">

        <div class="filtros-panel-header">
            <span class="filtros-panel-titulo">Filtros</span>
            <button class="filtros-panel-cerrar" id="filtrosCerrar" aria-label="Cerrar filtros">
                <svg viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="3" y1="3" x2="15" y2="15"/><line x1="15" y1="3" x2="3" y2="15"/>
                </svg>
            </button>
        </div>

        <div class="filtros-panel-body">

            <!-- DISPONIBILIDAD -->
            <div class="filtros-seccion">
                <h3 class="filtros-seccion-titulo">Disponibilidad</h3>
                <label class="filtros-check-item">
                    <input type="checkbox" class="filtros-disp-check" value="existencia">
                    <span class="filtros-check-caja"></span>
                    <span>En existencia</span>
                </label>
                <label class="filtros-check-item">
                    <input type="checkbox" class="filtros-disp-check" value="agotado">
                    <span class="filtros-check-caja"></span>
                    <span>Agotado</span>
                </label>
            </div>

            <!-- COLOR -->
            <div class="filtros-seccion">
                <h3 class="filtros-seccion-titulo">Color</h3>
                <div class="filtros-colores-grid">
                    <label class="filtros-color-item">
                        <input type="checkbox" class="filtros-color-check" value="blanco">
                        <span class="filtros-color-swatch filtros-color-swatch--blanco"></span>
                        <span class="filtros-color-nombre">Blanco</span>
                    </label>
                    <label class="filtros-color-item">
                        <input type="checkbox" class="filtros-color-check" value="crema">
                        <span class="filtros-color-swatch filtros-color-swatch--crema"></span>
                        <span class="filtros-color-nombre">Crema</span>
                    </label>
                    <label class="filtros-color-item">
                        <input type="checkbox" class="filtros-color-check" value="gris">
                        <span class="filtros-color-swatch filtros-color-swatch--gris"></span>
                        <span class="filtros-color-nombre">Gris</span>
                    </label>
                    <label class="filtros-color-item">
                        <input type="checkbox" class="filtros-color-check" value="negro">
                        <span class="filtros-color-swatch filtros-color-swatch--negro"></span>
                        <span class="filtros-color-nombre">Negro</span>
                    </label>
                </div>
            </div>

            <!-- ORDENAR POR -->
            <div class="filtros-seccion">
                <h3 class="filtros-seccion-titulo">Ordenar por</h3>
                <label class="filtros-radio-item">
                    <input type="radio" name="filtrosOrden" value="defecto" checked>
                    <span class="filtros-radio-circulo"></span>
                    <span>Más relevantes</span>
                </label>
                <label class="filtros-radio-item">
                    <input type="radio" name="filtrosOrden" value="menor-mayor">
                    <span class="filtros-radio-circulo"></span>
                    <span>Precio: menor a mayor</span>
                </label>
                <label class="filtros-radio-item">
                    <input type="radio" name="filtrosOrden" value="mayor-menor">
                    <span class="filtros-radio-circulo"></span>
                    <span>Precio: mayor a menor</span>
                </label>
                <label class="filtros-radio-item">
                    <input type="radio" name="filtrosOrden" value="az">
                    <span class="filtros-radio-circulo"></span>
                    <span>Alfabéticamente A–Z</span>
                </label>
                <label class="filtros-radio-item">
                    <input type="radio" name="filtrosOrden" value="za">
                    <span class="filtros-radio-circulo"></span>
                    <span>Alfabéticamente Z–A</span>
                </label>
                <label class="filtros-radio-item">
                    <input type="radio" name="filtrosOrden" value="reciente">
                    <span class="filtros-radio-circulo"></span>
                    <span>Más recientes primero</span>
                </label>
            </div>

            <!-- TALLA -->
            <div class="filtros-seccion">
                <h3 class="filtros-seccion-titulo">Talla</h3>
                <div class="filtros-tallas-grid">
                    <label class="filtros-talla-item">
                        <input type="checkbox" class="filtros-talla-check" value="S">
                        <span>S</span>
                    </label>
                    <label class="filtros-talla-item">
                        <input type="checkbox" class="filtros-talla-check" value="M">
                        <span>M</span>
                    </label>
                    <label class="filtros-talla-item">
                        <input type="checkbox" class="filtros-talla-check" value="L">
                        <span>L</span>
                    </label>
                    <label class="filtros-talla-item">
                        <input type="checkbox" class="filtros-talla-check" value="XL">
                        <span>XL</span>
                    </label>
                </div>
            </div>

        </div><!-- /filtros-panel-body -->

        <div class="filtros-panel-footer">
            <button class="filtros-btn-borrar" id="filtrosBorrar">Borrar todo</button>
            <button class="filtros-btn-aplicar" id="filtrosAplicar">Aplicar filtros</button>
        </div>

    </aside>

    <script type="module" src="../../scripts/main.js"></script>
    <script type="module" src="../../scripts/pages/tienda.js"></script>

</body>
</html>
