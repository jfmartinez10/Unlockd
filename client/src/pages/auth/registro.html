<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd - Registro</title>
    <link rel="icon" href="/public/assets/images/logo.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/components/header.css">
    <link rel="stylesheet" href="../../styles/components/footer.css">
    <link rel="stylesheet" href="../../styles/components/buttons.css">
    <link rel="stylesheet" href="../../styles/components/forms.css">
    <link rel="stylesheet" href="../../styles/pages/auth.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-left">
            <a href="/src/pages/index.html">Inicio</a>
            <a href="/src/pages/tienda/tienda.html">Tienda</a>
            <a href="/src/pages/contacto/contacto.html">Contacto</a>
        </nav> 

        <div class="logo-center">
            <a href="/src/pages/index.html">
                <img src="/public/assets/images/logo.png" alt="Logo Principal">
            </a>
        </div>

        <div class="nav-right">
            <span class="icon">
                <img src="/public/assets/images/icons/logo-lupa.svg" alt="Buscar">
            </span>
            <span class="icon">
                <a href="/src/pages/auth/login.html">
                    <img src="/public/assets/images/icons/logo-perfil.svg" alt="Perfil">
                </a>
            </span>
            <span class="icon">
                <img src="/public/assets/images/icons/logo-cesta.svg" alt="Carrito">
            </span>
        </div>
    </header>

    <section class="auth-seccion">
        <div class="auth-container">
            <div class="titulo-section">
                <h1 class="titulo-auth registro"><span>Registro</span></h1>
            </div>

            <form class="auth-form" id="registerForm">
                <input type="text" class="form-input" name="nombre" placeholder="Nombre" required>
                
                <input type="text" class="form-input" name="apellidos" placeholder="Apellidos" required>
                
                <input type="email" class="form-input" name="email" placeholder="Correo electrónico" required>
                
                <div class="password-container">
                    <input type="password" class="form-input" id="password" name="password" placeholder="Contraseña" required>
                    <button type="button" class="toggle-password" id="togglePassword"></button>
                </div>

                <div class="password-container">
                    <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" placeholder="Confirmar contraseña" required>
                    <button type="button" class="toggle-password" id="toggleConfirmPassword"></button>
                </div>

                <button type="submit" class="btn btn-block">Crear Cuenta</button>

                <a href="login.html" class="link-secondary">Iniciar sesión</a>
                <a href="../index.html" class="link-secondary">Volver a la tienda</a>
            </form>
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-left">
            <a href="/src/pages/legal/politica-privacidad.html" class="footer-link">Política de Privacidad</a>
            <a href="/src/pages/legal/politica-reembolso.html" class="footer-link">Política de Reembolso</a>
            <a href="/src/pages/legal/terminos-servicio.html" class="footer-link">Términos de Servicio</a>
        </div>
        
        <div class="footer-center">
            <img src="/public/assets/images/logo.png" alt="Logo Unlockd" class="footer-logo">
            <p class="footer-copyright">&copy; 2026 - Unlockd</p>
        </div>
    </footer>

    <script type="module" src="../../scripts/main.js"></script>
    <script type="module" src="../../scripts/pages/auth.js"></script>

</body>
</html>
