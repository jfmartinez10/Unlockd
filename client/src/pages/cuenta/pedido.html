<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd — Detalle del pedido</title>
    <link rel="icon" href="/public/assets/images/logo.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/components/header.css">
    <link rel="stylesheet" href="../../styles/components/footer.css">
    <link rel="stylesheet" href="../../styles/components/buttons.css">
    <link rel="stylesheet" href="../../styles/components/toast.css">
    <link rel="stylesheet" href="../../styles/pages/cuenta.css">
    <link rel="stylesheet" href="../../styles/pages/pedido.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-left">
            <a href="/src/pages/index.html">Inicio</a>
            <a href="/src/pages/tienda/tienda.html">Tienda</a>
            <a href="/src/pages/contacto/contacto.html">Contacto</a>
        </nav>

        <div class="logo-center">
            <a href="/src/pages/index.html">
                <img src="/public/assets/images/logo.png" alt="Logo Principal">
            </a>
        </div>

        <div class="nav-right">
            <span class="icon">
                <img src="/public/assets/images/icons/logo-lupa.svg" alt="Buscar">
            </span>
            <span class="icon">
                <a href="/src/pages/cuenta/cuenta.html">
                    <img src="/public/assets/images/icons/logo-perfil.svg" alt="Perfil">
                </a>
            </span>
            <span class="icon">
                <img src="/public/assets/images/icons/logo-cesta.svg" alt="Carrito">
            </span>
        </div>
    </header>

    <section class="pedido-seccion">

        <a href="/src/pages/cuenta/cuenta.html" class="pedido-volver">← Volver a mi cuenta</a>

        <div class="pedido-header">
            <h1 class="pedido-ref" id="pedidoRef">—</h1>
            <span class="pedido-badge" id="pedidoEstado"></span>
        </div>

        <p class="pedido-fecha" id="pedidoFecha"></p>

        <div class="pedido-bloques">

            <!-- Productos -->
            <div class="pedido-bloque">
                <p class="pedido-bloque-titulo">Productos</p>
                <div id="pedidoItems">
                    <div class="pedido-loading"></div>
                </div>
            </div>

            <!-- Dirección + totales -->
            <div class="pedido-bloque pedido-bloque--lateral">

                <div class="pedido-subbloque">
                    <p class="pedido-bloque-titulo">Dirección de envío</p>
                    <div id="pedidoDireccion" class="pedido-direccion-texto"></div>
                </div>

                <div class="pedido-subbloque">
                    <p class="pedido-bloque-titulo">Resumen</p>
                    <div id="pedidoTotales" class="pedido-totales"></div>
                </div>

            </div>
        </div>

    </section>

    <footer class="main-footer">
        <div class="footer-left">
            <a href="/src/pages/legal/politica-privacidad.html" class="footer-link">Política de Privacidad</a>
            <a href="/src/pages/legal/politica-reembolso.html" class="footer-link">Política de Reembolso</a>
            <a href="/src/pages/legal/terminos-servicio.html" class="footer-link">Términos de Servicio</a>
        </div>
        <div class="footer-center">
            <img src="/public/assets/images/logo.png" alt="Logo Unlockd" class="footer-logo">
            <p class="footer-copyright">&copy; 2026 - Unlockd</p>
        </div>
    </footer>

    <script type="module" src="../../scripts/main.js"></script>
    <script type="module" src="../../scripts/pages/pedido.js"></script>

</body>
</html>
