<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd - Detalles de la Cuenta</title>
    <link rel="icon" href="/public/assets/images/logo.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/components/header.css">
    <link rel="stylesheet" href="../../styles/components/footer.css">
    <link rel="stylesheet" href="../../styles/components/buttons.css">
    <link rel="stylesheet" href="../../styles/pages/auth.css">
    <link rel="stylesheet" href="../../styles/pages/cuenta.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-left">
            <a href="/src/pages/index.html">Inicio</a>
            <a href="/src/pages/tienda/tienda.html">Tienda</a>
            <a href="/src/pages/contacto/contacto.html">Contacto</a>
        </nav>

        <div class="logo-center">
            <a href="/src/pages/index.html">
                <img src="/public/assets/images/logo.png" alt="Logo Principal">
            </a>
        </div>

        <div class="nav-right">
            <span class="icon">
                <img src="/public/assets/images/icons/logo-lupa.svg" alt="Buscar">
            </span>
            <span class="icon">
                <a href="/src/pages/cuenta/cuenta.html">
                    <img src="/public/assets/images/icons/logo-perfil.svg" alt="Perfil">
                </a>
            </span>
            <span class="icon">
                <img src="/public/assets/images/icons/logo-cesta.svg" alt="Carrito">
            </span>
        </div>
    </header>

    <section class="detalles-seccion">
        <div class="titulo-section">
            <h1 class="titulo-auth"><span>Detalles de la cuenta</span></h1>
        </div>

        <a href="/src/pages/cuenta/cuenta.html" class="detalles-volver">Volver a la cuenta</a>

        <!-- Info actual -->
        <div class="detalles-info">
            <p class="detalles-nombre" id="detallesNombre"></p>
            <p class="detalles-email" id="detallesEmail"></p>
        </div>

        <!-- Editar perfil -->
        <div class="detalles-form-seccion">
            <p class="detalles-form-titulo">Editar perfil</p>
            <form id="perfilForm" class="detalles-form">
                <div class="detalles-fila">
                    <div class="detalles-campo">
                        <label class="detalles-label" for="perfilNombre">Nombre</label>
                        <input type="text" id="perfilNombre" name="nombre" class="modal-campo" required>
                    </div>
                    <div class="detalles-campo">
                        <label class="detalles-label" for="perfilApellidos">Apellidos</label>
                        <input type="text" id="perfilApellidos" name="apellidos" class="modal-campo" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-block" id="btnGuardarPerfil">Guardar cambios</button>
            </form>
        </div>

        <!-- Cambiar contraseña -->
        <div class="detalles-form-seccion">
            <p class="detalles-form-titulo">Cambiar contraseña</p>
            <form id="passwordForm" class="detalles-form">
                <div class="detalles-campo">
                    <label class="detalles-label" for="passActual">Contraseña actual</label>
                    <input type="password" id="passActual" name="actual" class="modal-campo" required>
                </div>
                <div class="detalles-campo">
                    <label class="detalles-label" for="passNueva">Nueva contraseña</label>
                    <input type="password" id="passNueva" name="nueva" class="modal-campo" required
                           placeholder="Mín. 8 caracteres, 1 mayúscula, 1 número">
                </div>
                <div class="detalles-campo">
                    <label class="detalles-label" for="passConfirm">Confirmar nueva contraseña</label>
                    <input type="password" id="passConfirm" name="confirmar" class="modal-campo" required>
                </div>
                <button type="submit" class="btn btn-block" id="btnGuardarPassword">Cambiar contraseña</button>
            </form>
        </div>

        <!-- Direcciones -->
        <div class="detalles-form-seccion">
            <p class="detalles-form-titulo">Direcciones de envío</p>
            <div id="listaDirecciones" class="detalles-lista-direcciones"></div>
            <div class="detalles-btn-wrap">
                <button class="btn" id="btnAnadirDireccion">Añadir nueva dirección</button>
            </div>
        </div>
    </section>

    <!-- Modal de dirección -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-cerrar" id="modalCerrar" aria-label="Cerrar">&times;</button>

            <form id="direccionForm">
                <input type="text"     class="modal-campo" id="dirNombre"     placeholder="Nombre"      required>
                <input type="text"     class="modal-campo" id="dirApellidos"  placeholder="Apellidos"   required>
                <input type="text"     class="modal-campo" id="dirPais"       placeholder="País"        required>
                <input type="text"     class="modal-campo" id="dirCiudad"     placeholder="Ciudad"      required>
                <input type="text"     class="modal-campo" id="dirProvincia"  placeholder="Provincia"   required>
                <input type="text"     class="modal-campo" id="dirDireccion"  placeholder="Dirección"   required>
                <input type="text"     class="modal-campo" id="dirCodPostal"  placeholder="Código postal" required>
                <input type="text"     class="modal-campo" id="dirDireccion2" placeholder="Dirección 2 (opcional)">

                <label class="modal-checkbox-wrap">
                    <input type="checkbox" id="dirPredeterminada">
                    Definir como dirección predeterminada
                </label>

                <button type="submit" class="btn btn-block">Actualizar dirección</button>
                <button type="button" class="modal-cancelar" id="modalCancelar">Cancelar</button>
            </form>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-left">
            <a href="/src/pages/legal/politica-privacidad.html" class="footer-link">Política de Privacidad</a>
            <a href="/src/pages/legal/politica-reembolso.html" class="footer-link">Política de Reembolso</a>
            <a href="/src/pages/legal/terminos-servicio.html" class="footer-link">Términos de Servicio</a>
        </div>

        <div class="footer-center">
            <img src="/public/assets/images/logo.png" alt="Logo Unlockd" class="footer-logo">
            <p class="footer-copyright">&copy; 2026 - Unlockd</p>
        </div>
    </footer>

    <script type="module" src="../../scripts/main.js"></script>
    <script type="module" src="../../scripts/pages/detalles.js"></script>

</body>
</html>
