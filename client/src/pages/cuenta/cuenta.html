<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd - Tu Cuenta</title>
    <link rel="icon" href="/public/assets/images/logo.png">
    <link rel="stylesheet" href="../../styles/variables.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/components/header.css">
    <link rel="stylesheet" href="../../styles/components/footer.css">
    <link rel="stylesheet" href="../../styles/components/buttons.css">
    <link rel="stylesheet" href="../../styles/pages/auth.css">
    <link rel="stylesheet" href="../../styles/pages/cuenta.css">
</head>
<body>

    <header class="main-header">
        <nav class="nav-left">
            <a href="/src/pages/index.html">Inicio</a>
            <a href="/src/pages/tienda/tienda.html">Tienda</a>
            <a href="/src/pages/contacto/contacto.html">Contacto</a>
        </nav>

        <div class="logo-center">
            <a href="/src/pages/index.html">
                <img src="/public/assets/images/logo.png" alt="Logo Principal">
            </a>
        </div>

        <div class="nav-right">
            <span class="icon">
                <img src="/public/assets/images/icons/logo-lupa.svg" alt="Buscar">
            </span>
            <span class="icon">
                <a href="/src/pages/cuenta/cuenta.html">
                    <img src="/public/assets/images/icons/logo-perfil.svg" alt="Perfil">
                </a>
            </span>
            <span class="icon">
                <img src="/public/assets/images/icons/logo-cesta.svg" alt="Carrito">
            </span>
        </div>
    </header>

    <section class="cuenta-seccion">
        <div class="titulo-section">
            <h1 class="titulo-auth"><span>Tu cuenta</span></h1>
        </div>

        <button class="cuenta-cerrar" id="btnCerrarSesion">Cerrar sesión</button>

        <div class="cuenta-grid">
            <div class="cuenta-col cuenta-col-pedidos">
                <p class="cuenta-col-titulo">Pedidos</p>
                <div id="pedidosContenido">
                    <p class="cuenta-pedidos-vacio">Aún no hay pedidos</p>
                    <p class="cuenta-pedidos-subtexto">¿Listo para desbloquear tu nuevo estilo?</p>
                </div>
            </div>

            <div class="cuenta-col cuenta-col-detalles">
                <div>
                    <p class="cuenta-col-titulo">Detalles de la cuenta</p>
                    <a href="/src/pages/cuenta/detalles.html" class="cuenta-detalles-btn" aria-label="Ver detalles">&#8594;</a>
                </div>
            </div>
        </div>

        <!-- Favoritos -->
        <div class="cuenta-favoritos-seccion">
            <p class="cuenta-col-titulo">Favoritos</p>
            <div class="cuenta-favoritos-grid" id="favoritosContenido">
                <p class="cuenta-pedidos-vacio">Cargando...</p>
            </div>
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-left">
            <a href="/src/pages/legal/politica-privacidad.html" class="footer-link">Política de Privacidad</a>
            <a href="/src/pages/legal/politica-reembolso.html" class="footer-link">Política de Reembolso</a>
            <a href="/src/pages/legal/terminos-servicio.html" class="footer-link">Términos de Servicio</a>
        </div>

        <div class="footer-center">
            <img src="/public/assets/images/logo.png" alt="Logo Unlockd" class="footer-logo">
            <p class="footer-copyright">&copy; 2026 - Unlockd</p>
        </div>
    </footer>

    <script type="module" src="../../scripts/main.js"></script>
    <script type="module" src="../../scripts/pages/cuenta.js"></script>

</body>
</html>
