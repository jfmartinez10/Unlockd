<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlockd - Registro</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" href="./img/logo.png">
</head>
<body>

    <header class="main-header">
        <nav class="nav-left">
            <a href="../PagInicio/index.html">Inicio</a>
            <a href="#">Tienda</a>
            <a href="../PagContacto/contacto.html">Contacto</a>
        </nav> 

        <div class="logo-center">
            <a href="../PagInicio/index.html">
                <img src="./img/logo.png" alt="Logo Principal">
            </a>
        </div>

        <div class="nav-right">
            <span class="icon">
                <img src="./img/logo-lupa.png" alt="Buscar">
            </span>
            <span class="icon">
                <a href="../PagAuth/login.html">
                    <img src="./img/logo-perfil.png" alt="Perfil">
                </a>
            </span>
            <span class="icon">
                <img src="./img/logo-cesta.png" alt="Carrito">
            </span>
        </div>
    </header>

    <section class="auth-seccion">
        <div class="auth-container">
            <div class="titulo-section">
                <h1 class="titulo-auth registro"><span>Registro</span></h1>
            </div>

            <form class="auth-form">
                <input type="text" class="form-input" placeholder="Nombre" required>
                
                <input type="text" class="form-input" placeholder="Apellidos" required>
                
                <input type="email" class="form-input" placeholder="Correo electrónico" required>
                
                <div class="password-container">
                    <input type="password" class="form-input" id="password" placeholder="Contraseña" required>
                    <button type="button" class="toggle-password" id="togglePassword"></button>
                </div>

                <div class="password-container">
                    <input type="password" class="form-input" id="confirmPassword" placeholder="Confirmar contraseña" required>
                    <button type="button" class="toggle-password" id="toggleConfirmPassword"></button>
                </div>

                <button type="submit" class="btn-submit">Acceder</button>

                <a href="login.html" class="link-secondary">Iniciar sesión</a>
                <a href="#Tienda" class="link-secondary">Volver a la tienda</a>
            </form>
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-left">
            <a href="politica-privacidad.html" class="footer-link">Política de Privacidad</a>
            <a href="politica-reembolso.html" class="footer-link">Política de Reembolso</a>
            <a href="terminos-servicio.html" class="footer-link">Términos de Servicio</a>
        </div>
        
        <div class="footer-center">
            <img src="./img/logo.png" alt="Logo Unlockd" class="footer-logo">
            <p class="footer-copyright">&copy; 2025 - Unlockd </p>
        </div>
    </footer>

    <script src="auth.js"></script>

</body>
</html>
